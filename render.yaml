envVarGroups:
  - name: quickseats-production
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BULLMQ_REDIS_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SOCKET_CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INTERNAL_CLEANUP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: usd
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        sync: false
      - key: STRIPE_CHECKOUT_CANCEL_URL
        sync: false
services:
  - type: web
    name: quickseats-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: false
    envVars:
      - fromGroup: quickseats-production
  - type: worker
    name: quickseats-worker
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    autoDeploy: false
    envVars:
      - fromGroup: quickseats-production
